background {
    monitor =
    path = ~/Pictures/1.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 0
}


# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color =rgb(240, 231, 219)
    font_size = 60
    font_family = TeachingPrintDotted-OVKlp
    position = -60, 400
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +":%M")</span>"
    color = rgb(214, 209, 209)
    font_size = 60
    font_family = TeachingPrintDotted-OVKlp
    position = 45, 400
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgb(200, 200, 200)
    font_size = 19
    font_family = TeachingPrintDotted-OVKlp
    position = 0, 340
    halign = center
    valign = center
}


input-field {
    monitor =
    
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgb(ff0000)  # Ярко-красный
    check_color = rgb(cc0000)  # Темно-красный
    fail_color = rgb(ff3333)   # Светло

    font_color = rgb(ffffff)
    fade_on_empty = true
    rounding = 15

    position = 0, 200
    halign = center
    valign = center
}